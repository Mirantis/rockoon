[build-system]
requires = ["setuptools>=30.3.0", "wheel", "pbr>=2.0.0"]

[tool.black]
line-length = 79
target_version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
# sort imports by default
extend-select = ["I"]

[tool.ruff.lint.isort]
# sort imports by resulting module path, not simply alphabetically
force-sort-within-sections = true
